<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Poortjie Rider Admin | Digilayn</title>
    
    <meta name="theme-color" content="#22c55e">
    <link rel="icon" href="../../../../../favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="../../../../../favicon/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="../../../../../favicon/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="../../../../../favicon/apple-touch-icon.png">
    <link rel="manifest" href="../../../../../favicon/site.webmanifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="../../../../../styles/main.css">

    <script type="module">
        import { db } from "../../../../../scripts/firebase-config.js";
        import {
            initAdminAuth,
            loginAdmin,
            logoutAdmin
        } from "../../../../../scripts/admin-auth.js";
        import {
            doc,
            getDoc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const configRef = doc(db, "appConfig", "com.digilayn.poortjierider");

        const status = document.getElementById("status");
        const adminPanel = document.getElementById("adminPanel");
        const loginSection = document.getElementById("loginSection");

        function setStatus(message, isError = false) {
            if (!status) return;
            status.textContent = message;
            status.className = `p-4 rounded-xl font-bold mb-6 ${isError ? "bg-red-500/20 text-red-500 border border-red-500/50" : "bg-green-500/20 text-green-500 border border-green-500/50"}`;
        }

        initAdminAuth(
            (user) => {
                adminPanel.classList.remove("hidden");
                loginSection.classList.add("hidden");
                loadConfig();
            },
            (error) => {
                adminPanel.classList.add("hidden");
                loginSection.classList.remove("hidden");
                if (error) setStatus(error, true);
            }
        );

        window.login = async function() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            try {
                setStatus("Authenticating...");
                await loginAdmin(email, password);
            } catch (error) {
                setStatus(`Login failed: ${error.message}`, true);
            }
        }

        window.logout = async function() {
            try {
                await logoutAdmin();
                setStatus("Logged out.");
            } catch (error) {
                setStatus(`Logout failed: ${error.message}`, true);
            }
        }

        function getFormData() {
            return {
                upgrade: {
                    enabled: document.getElementById("upgradeEnabled").checked,
                    min_version_code: Number(document.getElementById("minVersion").value),
                    latest_version_code: Number(document.getElementById("latestVersion").value),
                    message: document.getElementById("upgradeMessage").value.trim()
                },
                blocker: {
                    enabled: document.getElementById("blockerEnabled").checked,
                    title: document.getElementById("blockerTitle").value.trim(),
                    message: document.getElementById("blockerMessage").value.trim()
                },
                auth: {
                    registration_enabled: document.getElementById("registrationEnabled").checked,
                    google_signin_enabled: document.getElementById("googleEnabled").checked,
                    email_signin_enabled: document.getElementById("emailEnabled").checked
                },
                updated_at: serverTimestamp()
            };
        }

        function populateForm(data) {
            const upgrade = data.upgrade || {};
            const blocker = data.blocker || {};
            const auth = data.auth || {};

            document.getElementById("upgradeEnabled").checked = upgrade.enabled ?? false;
            document.getElementById("minVersion").value = upgrade.min_version_code ?? 1;
            document.getElementById("latestVersion").value = upgrade.latest_version_code ?? 1;
            document.getElementById("upgradeMessage").value = upgrade.message ?? "";

            document.getElementById("blockerEnabled").checked = blocker.enabled ?? false;
            document.getElementById("blockerTitle").value = blocker.title ?? "";
            document.getElementById("blockerMessage").value = blocker.message ?? "";

            document.getElementById("registrationEnabled").checked = auth.registration_enabled ?? true;
            document.getElementById("googleEnabled").checked = auth.google_signin_enabled ?? true;
            document.getElementById("emailEnabled").checked = auth.email_signin_enabled ?? true;
        }

        window.loadConfig = async function() {
            try {
                setStatus("Fetching latest configuration...");
                const snapshot = await getDoc(configRef);

                if (!snapshot.exists()) {
                    setStatus("Configuration not found. Seed defaults if this is the first run.", true);
                    return;
                }

                populateForm(snapshot.data());
                setStatus("Configuration loaded successfully.");
            } catch (error) {
                setStatus(`Load failed: ${error.message}`, true);
            }
        }

        window.saveConfig = async function() {
            try {
                setStatus("Saving configuration...");
                await setDoc(configRef, getFormData());
                setStatus("Configuration saved successfully.");
            } catch (error) {
                setStatus(`Save failed: ${error.message}`, true);
            }
        }

        window.seedDefaults = async function() {
            if (!confirm("Are you sure you want to seed default values? This will overwrite current settings.")) return;
            try {
                setStatus("Seeding default configuration...");
                await setDoc(configRef, {
                    upgrade: {
                        enabled: false,
                        min_version_code: 1,
                        latest_version_code: 1,
                        message: "Please update to continue"
                    },
                    blocker: {
                        enabled: false,
                        title: "",
                        message: ""
                    },
                    auth: {
                        registration_enabled: true,
                        google_signin_enabled: true,
                        email_signin_enabled: true
                    },
                    updated_at: serverTimestamp()
                });
                await loadConfig();
                setStatus("Defaults seeded successfully.");
            } catch (error) {
                setStatus(`Seed failed: ${error.message}`, true);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            document.getElementById("loadBtn").addEventListener("click", window.loadConfig);
            document.getElementById("saveBtn").addEventListener("click", window.saveConfig);
            document.getElementById("seedBtn").addEventListener("click", window.seedDefaults);
            document.getElementById("loginBtn").addEventListener("click", window.login);
            document.getElementById("logoutBtn").addEventListener("click", window.logout);
        });
    </script>
</head>
<body class="font-sans antialiased bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300">

<nav class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center p-6 pointer-events-none">
    <a href="/index.html" class="pointer-events-auto text-sm font-black tracking-wide px-4 py-2 rounded-full bg-white/80 dark:bg-slate-800/80 backdrop-blur-md shadow border border-slate-200 dark:border-slate-700 hover:text-green-500 transition">
        digilayn
    </a>
    <div class="flex items-center gap-3 pointer-events-auto">
        <button id="theme-toggle" class="p-3 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md rounded-full shadow-lg border border-slate-200 dark:border-slate-700 transition-transform hover:scale-110 active:scale-95" aria-label="Toggle Theme">
            <span id="theme-icon" class="text-xl"></span>
        </button>
    </div>
</nav>

<main class="max-w-4xl mx-auto pt-28 pb-16 px-6">
    <div id="loginSection" class="hidden min-h-[60vh] flex flex-col items-center justify-center">
        <div class="w-full max-w-md p-8 rounded-3xl bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700">
            <h2 class="text-3xl font-extrabold mb-2">Admin Access</h2>
            <p class="text-slate-500 dark:text-slate-400 mb-8">Poortjie Rider Management</p>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold mb-2 opacity-70">Email Address</label>
                    <input type="email" id="email" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-green-500 outline-none transition" placeholder="admin@digilayn.com">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2 opacity-70">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-green-500 outline-none transition">
                </div>
                <button id="loginBtn" class="w-full py-4 bg-green-600 text-white font-black rounded-xl hover:bg-green-700 transition transform hover:scale-[1.02] active:scale-[0.98]">
                    Sign In
                </button>
            </div>
        </div>
    </div>

    <div id="adminPanel" class="hidden">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10">
            <div>
                <p class="text-sm font-black uppercase tracking-[0.3em] text-green-500 mb-1">Production Console</p>
                <h1 class="text-4xl font-extrabold tracking-tight">Poortjie Rider Config</h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="logoutBtn" class="px-6 py-2 border border-red-500/50 text-red-500 font-bold rounded-full hover:bg-red-500 hover:text-white transition">
                    Logout
                </button>
            </div>
        </div>

        <div id="status" class="hidden"></div>

        <div class="grid gap-8">
            <!-- Force Upgrade Card -->
            <section class="p-8 rounded-3xl bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold">Force Upgrade</h3>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="upgradeEnabled" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-200 dark:bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                    </label>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold mb-2 opacity-70">Min Version Code</label>
                        <input type="number" id="minVersion" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 opacity-70">Latest Version Code</label>
                        <input type="number" id="latestVersion" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 outline-none">
                    </div>
                </div>
                <div class="mt-6">
                    <label class="block text-sm font-bold mb-2 opacity-70">Upgrade Message</label>
                    <textarea id="upgradeMessage" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 outline-none min-h-[100px]"></textarea>
                </div>
            </section>

            <!-- Blocker Screen Card -->
            <section class="p-8 rounded-3xl bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold">Blocker Screen</h3>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="blockerEnabled" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-200 dark:bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                    </label>
                </div>
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold mb-2 opacity-70">Blocker Title</label>
                        <input type="text" id="blockerTitle" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 opacity-70">Blocker Message</label>
                        <textarea id="blockerMessage" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 outline-none min-h-[100px]"></textarea>
                    </div>
                </div>
            </section>

            <!-- Auth Configuration Card -->
            <section class="p-8 rounded-3xl bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700">
                <h3 class="text-xl font-bold mb-6">Authentication Settings</h3>
                <div class="space-y-4">
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="registrationEnabled" class="w-5 h-5 rounded border-slate-300 text-green-600 focus:ring-green-500">
                        <span class="font-medium group-hover:text-green-500 transition">Enable User Registration</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="googleEnabled" class="w-5 h-5 rounded border-slate-300 text-green-600 focus:ring-green-500">
                        <span class="font-medium group-hover:text-green-500 transition">Enable Google Sign-In</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="emailEnabled" class="w-5 h-5 rounded border-slate-300 text-green-600 focus:ring-green-500">
                        <span class="font-medium group-hover:text-green-500 transition">Enable Email/Password Sign-In</span>
                    </label>
                </div>
            </section>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-4 pt-4">
                <button id="saveBtn" class="px-10 py-4 bg-green-600 text-white font-black rounded-2xl hover:bg-green-700 transition transform hover:scale-105 shadow-lg shadow-green-500/20">
                    Save Configuration
                </button>
                <button id="loadBtn" class="px-8 py-4 border border-slate-300 dark:border-slate-600 font-bold rounded-2xl hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                    Reload Current
                </button>
                <button id="seedBtn" class="px-8 py-4 border border-red-500/30 text-red-500/70 font-bold rounded-2xl hover:bg-red-50 dark:hover:bg-red-950/20 transition">
                    Seed Defaults
                </button>
            </div>
        </div>
    </div>
</main>

<script src="/scripts/theme.js"></script>
<script src="/scripts/security.js"></script>
</body>
</html>
